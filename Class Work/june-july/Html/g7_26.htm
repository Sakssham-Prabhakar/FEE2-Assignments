<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #para{
            color: aqua;
        }
        p{
            color: red
        }
        .paraclass{
            color:blueviolet
        }
        div{
            height: 100px;
            width: 400px;
            border: 5px solid black;
            border-radius: 10px;
            padding: 25px;
            margin: 100px;
            box-sizing: border-box;
        }
    </style>
</head>
<!-- // priority: Inline > Id > Class > Element > psudo classes/element > universal-->
 <!-- Inline > internal > Extermal -->
<body>
        <div>
        <p id="para"> This is a para</p>
        <p> This is second para </p>
        <p class="paraclass"> This is third para</p>
        </div>

    <progress value="50" max="100" style="display: block;"></progress>

</body>
</html>
